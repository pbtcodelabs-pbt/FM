{"name":"unzip-upload","on":["push","workflow_dispatch"],"permissions":{"contents":"write","checks":"write","pull-requests":"write"},"concurrency":{"group":"fm-zip-deploy","cancel-in-progress":false},"jobs":{"unzip_and_deploy":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Extract zip","id":"ex","run":"shopt -s nullglob; zips=( *.zip ); if [ ${#zips[@]} -eq 0 ]; then echo no-zip; exit 0; fi; for z in \"${zips[@]}\"; do unzip -o \"$z\" -d . && rm -f \"$z\"; done; git config user.name zip-bot; git config user.email zip-bot@users.noreply.github.com; git add -A; git commit -m unzip-upload && git push; echo found=1 >> \"$GITHUB_OUTPUT\""},{"name":"Deploy to Firebase","if":"steps.ex.outputs.found == '1'","uses":"FirebaseExtended/action-hosting-deploy@v0","with":{"repoToken":"${{ secrets.GITHUB_TOKEN }}","firebaseServiceAccount":"${{ secrets.FIREBASE_SERVICE_ACCOUNT_FM_SADDAM_MANDI }}","channelId":"live","projectId":"fm-saddam-mandi"}}]}}}
