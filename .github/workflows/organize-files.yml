
{"name":"organize-files","on":["workflow_dispatch"],"permissions":{"contents":"write"},"jobs":{"org":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Organize","run":"mkdir -p icons fonts; for f in favicon-32.png icon-180.png icon-192.png icon-512.png; do if [ -f \"$f\" ] && [ ! -f \"icons/$f\" ]; then cp \"$f\" \"icons/$f\"; fi; done; for f in JameelNooriNastaleeq-Regular.ttf JameelNooriNastaleeq-Kasheeda.ttf; do if [ -f \"$f\" ] && [ ! -f \"fonts/$f\" ]; then cp \"$f\" \"fonts/$f\"; fi; done; for f in PTSimpleBoldRuled.ttf ThuluthAlsmt.ttf JameelKhushkhati.ttf; do if [ ! -f \"fonts/$f\" ]; then curl -fsSL -o \"fonts/$f\" \"https://raw.githubusercontent.com/${{ github.repository_owner }}/SM/main/fonts/$f\" || rm -f \"fonts/$f\"; fi; done; if grep -q 'href=\"icons/favicon-32.png\"' index.html; then for f in favicon-32.png icon-180.png icon-192.png icon-512.png JameelNooriNastaleeq-Regular.ttf JameelNooriNastaleeq-Kasheeda.ttf; do if [ -f \"$f\" ]; then git rm -q \"$f\"; fi; done; fi; ls icons fonts; git config user.name zip-bot; git config user.email zip-bot@users.noreply.github.com; git add -A; git commit -m organize-files && git push || echo nothing-to-do"}]}}}
