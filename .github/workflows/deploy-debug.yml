# 🔍 فائربیس ڈیپلائے کی اصل غلطی پڑھنے کے لیے — نتیجہ "deploy-log" برانچ میں deploy-log.txt میں لکھا جاتا ہے
name: deploy-debug
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with full log
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FM_SADDAM_MANDI }}
        run: |
          echo "$SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          set +e
          gcloud auth activate-service-account --key-file=/tmp/sa.json > /tmp/out.txt 2>&1
          TOKEN=$(gcloud auth print-access-token)
          echo "== live channel: keep only last 5 releases" >> /tmp/out.txt
          curl -s -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/fm-saddam-mandi/channels/live?updateMask=retainedReleaseCount" \
            -d '{"retainedReleaseCount": 5}' >> /tmp/out.txt 2>&1
          echo "== channels" >> /tmp/out.txt
          curl -s -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/fm-saddam-mandi/channels" | grep -E '"name"|retained|expireTime' >> /tmp/out.txt
          echo "== versions count" >> /tmp/out.txt
          curl -s -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/fm-saddam-mandi/versions?pageSize=100" | grep -c '"status"' >> /tmp/out.txt
          sleep 60
          npx --yes firebase-tools@latest deploy --only hosting --project fm-saddam-mandi --non-interactive >> /tmp/out.txt 2>&1
          echo "EXIT=$?" >> /tmp/out.txt
          grep -v -i "private_key" /tmp/out.txt | tail -80 > /tmp/deploy-log.txt
          rm -f /tmp/sa.json
          git config user.name zip-bot; git config user.email zip-bot@users.noreply.github.com
          git checkout --orphan deploy-log
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/deploy-log.txt deploy-log.txt
          git add deploy-log.txt; git commit -qm "deploy log"; git push -f origin deploy-log
