<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>صدام فروٹ منڈی</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f766e,#063c38);
       font-family:'Jameel Noori Nastaleeq','Noto Nastaliq Urdu','Segoe UI',Tahoma,sans-serif;color:#fff;text-align:center}
  .card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:36px 46px;max-width:460px}
  img{width:110px;height:110px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  h1{font-size:30px;margin:18px 0 6px}
  p{font-size:20px;line-height:2;margin:6px 0 22px;color:#ccfbf1}
  button{font:inherit;font-size:22px;padding:10px 40px;border:none;border-radius:14px;background:#facc15;color:#063c38;
         font-weight:700;cursor:pointer;box-shadow:0 4px 0 #a16207}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #a16207}
</style>
</head>
<body>
  <div class="card">
    <img src="build/icon.png" alt="">
    <h1>صدام فروٹ منڈی</h1>
    <p>انٹرنیٹ سے رابطہ نہیں ہو سکا۔<br>انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔</p>
    <button onclick="location.href='https://fm-saddam-mandi.web.app/'">🔄 دوبارہ کوشش کریں</button>
  </div>
  <script>window.addEventListener('online',function(){location.href='https://fm-saddam-mandi.web.app/';});</script>
</body>
</html>
